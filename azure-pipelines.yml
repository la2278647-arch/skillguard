# Azure Pipelines 配置 — SkillGuard CI 流水线
# 激活方式：Azure DevOps 创建流水线指向本仓库（无需 GitHub workflow scope）
trigger:
  - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python310:
      python.version: '3.10'
    Python312:
      python.version: '3.12'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      addToPath: true

  - script: |
      python -m pip install --upgrade pip
      pip install -e ".[dev]"
    displayName: 'Install dependencies'

  - script: ruff check skillguard tests
    displayName: 'Lint (ruff)'

  - script: pytest --cov=skillguard --cov-fail-under=95
    displayName: 'Test + coverage'

  - script: python -m build
    displayName: 'Build check'