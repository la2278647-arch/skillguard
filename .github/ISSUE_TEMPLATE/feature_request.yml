name: ✨ Feature Request
description: 建议一个新功能或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        你的想法很重要！请描述你希望添加的功能。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你想解决什么问题？为什么现有功能不够？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望这个功能如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些其他方案？
